<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>提交關鍵字 · 即時文字雲</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p.subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input[type="text"] {
      width: 100%; padding: 14px 16px;
      font-size: 18px;
      background: #0f172a; color: var(--text);
      border: 2px solid #334155; border-radius: 10px;
      outline: none; transition: border 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px;
      padding: 14px; font-size: 16px; font-weight: 600;
      background: var(--accent); color: #0f172a;
      border: none; border-radius: 10px;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 14px; border-radius: 8px;
      font-size: 14px; min-height: 20px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
    .status.error { background: rgba(239,68,68,0.15); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
    .nav { margin-top: 20px; text-align: center; font-size: 13px; }
    .nav a { color: var(--accent); text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 輸入你的想法</h1>
    <p class="subtitle">送出後會即時顯示在文字雲上</p>

    <form id="form">
      <label for="word">關鍵字（1-20 字）</label>
      <input id="word" type="text" maxlength="20" placeholder="例如：勇敢" autocomplete="off" required />
      <div class="hint">同一個詞重複出現會放大。</div>
      <button id="submit" type="submit">送出</button>
    </form>

    <div id="status" class="status"></div>

    <div class="nav">
      <a href="display.html" target="_blank">→ 開啟文字雲展示頁</a>
    </div>
  </div>

  <script type="module">
    import {
      db, collection, addDoc, serverTimestamp,
    } from "./firebase-config.js";

    const form = document.getElementById("form");
    const input = document.getElementById("word");
    const button = document.getElementById("submit");
    const statusBox = document.getElementById("status");

    function showStatus(msg, kind) {
      statusBox.className = `status show ${kind}`;
      statusBox.textContent = msg;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (text.length > 20) {
        showStatus("關鍵字最多 20 字", "error");
        return;
      }
      button.disabled = true;
      try {
        await addDoc(collection(db, "wordcloud_words"), {
          text,
          created_at: serverTimestamp(),
        });
        showStatus(`已送出：「${text}」`, "success");
        input.value = "";
        input.focus();
      } catch (err) {
        console.error(err);
        showStatus(`送出失敗：${err.message}`, "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
